<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Crafty{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #222; }
        header, footer { background: #1f2937; color: white; padding: 1rem 2rem; }
        header a, footer a { color: #f8fafc; text-decoration: none; margin-right: 1rem; }
        nav a:hover { text-decoration: underline; }
        .page-container { max-width: 1140px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 0.5rem; padding: 1.25rem; box-shadow: 0 4px 18px rgba(0,0,0,0.05); margin-bottom: 1rem; }
        .grid { display: grid; gap: 1rem; }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .button { display: inline-block; padding: 0.65rem 1rem; background: #2563eb; color: white; border-radius: 0.5rem; text-decoration: none; }
        .button-outline { background: transparent; border: 1px solid #2563eb; color: #2563eb; }
        .button:hover { opacity: 0.95; }
        img { max-width: 100%; border-radius: 0.5rem; }
        .product-meta { margin-top: 0.75rem; color: #475569; }
        .tag { display: inline-block; padding: 0.2rem 0.6rem; background: #e2e8f0; border-radius: 999px; font-size: 0.85rem; margin-right: 0.35rem; }
        .page-heading { margin-top: 0; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home-page' %}">Home</a>
            <a href="{% url 'product-list-page' %}">Shop</a>
            <a href="{% url 'artisan-list-page' %}">Artisans</a>
            <a href="{% url 'cart-page' %}">Cart</a>
        </nav>
    </header>

    <div class="page-container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="page-container">
            <p>Crafty — Handmade goods marketplace.</p>
        </div>
    </footer>
</body>
</html>
